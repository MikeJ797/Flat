<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CUS Ground Floor VR - Polished Quest 3 mock-up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Approximate Quest 3 WebXR walkthrough of the proposed CUS ground floor apartment with furniture and fixtures.">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .note { position: fixed; left: 12px; bottom: 12px; background: rgba(255,255,255,.88); padding: 10px 12px; border-radius: 8px; max-width: 520px; font-size: 13px; line-height: 1.35; z-index: 10; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    .note strong { display: block; margin-bottom: 4px; }
  </style>
  <script>
    AFRAME.registerComponent('label-toggle', {
      init: function () {
        const labels = () => document.querySelectorAll('.optional-label');
        window.addEventListener('keydown', function (ev) {
          if (ev.key.toLowerCase() === 'l') {
            labels().forEach(el => el.setAttribute('visible', !(el.getAttribute('visible') === true || el.getAttribute('visible') === 'true')));
          }
        });
      }
    });
  </script>
</head>
