<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CUS Ground Floor VR - plan matched scale version</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Plan-matched Quest 3 WebXR walkthrough of the CUS proposed ground-floor apartment.">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .note { position: fixed; left: 12px; bottom: 12px; background: rgba(255,255,255,.90); padding: 10px 12px; border-radius: 8px; max-width: 580px; font-size: 13px; line-height: 1.35; z-index: 10; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
    .note strong { display: block; margin-bottom: 4px; }
  </style>
  <script>
    AFRAME.registerComponent('plan-walk-controls', {
      schema: { speed: {default: 1.6}, turnSpeed: {default: 72}, invertY: {default: true} },
      init: function () {
        this.left = {x:0, y:0};
        this.right = {x:0, y:0};
        this.keys = {};
        this.camera = null;
        this.tmpForward = new THREE.Vector3();
        this.tmpRight = new THREE.Vector3();
        const leftHand = document.querySelector('#leftHand');
        const rightHand = document.querySelector('#rightHand');
        const setAxis = (target) => (ev) => { target.x = ev.detail.x || 0; target.y = ev.detail.y || 0; };
        const clearAxis = (target) => () => { target.x = 0; target.y = 0; };
        if (leftHand) {
          leftHand.addEventListener('thumbstickmoved', setAxis(this.left));
          leftHand.addEventListener('thumbsticktouchend', clearAxis(this.left));
          leftHand.addEventListener('xbuttondown', () => {
            this.data.invertY = !this.data.invertY;
            const msg = document.querySelector('#control-message');
            if (msg) msg.setAttribute('value', 'Joystick Y inverted: ' + (!this.data.invertY ? 'ON' : 'OFF'));
          });
        }
        if (rightHand) {
          rightHand.addEventListener('thumbstickmoved', setAxis(this.right));
          rightHand.addEventListener('thumbsticktouchend', clearAxis(this.right));
        }
        window.addEventListener('keydown', e => {
          this.keys[e.key.toLowerCase()] = true;
          if (e.key.toLowerCase() === 'i') this.data.invertY = !this.data.invertY;
        });
        window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
      },
      tick: function (time, dt) {
        if (!dt) return;
        if (!this.camera) this.camera = document.querySelector('#camera');
        const rig = this.el.object3D;
        const cam = this.camera ? this.camera.object3D : rig;
        const seconds = Math.min(dt / 1000, 0.05);
        let axisX = this.left.x || 0;
        let axisY = this.left.y || 0;
        if (Math.abs(axisX) < 0.12) axisX = 0;
        if (Math.abs(axisY) < 0.12) axisY = 0;
        // Desktop controls for testing.
        if (this.keys['w']) axisY = -1;
        if (this.keys['s']) axisY = 1;
        if (this.keys['a']) axisX = -1;
        if (this.keys['d']) axisX = 1;

        // Standard WebXR gamepad convention: thumbstick up is y = -1, so forwardAmount = -axisY.
        // If a browser/controller maps this the other way round, press X on the left controller or I on keyboard.
        const forwardAmount = (this.data.invertY ? -axisY : axisY);
        const rightAmount = axisX;

        cam.getWorldDirection(this.tmpForward);
        this.tmpForward.y = 0;
        if (this.tmpForward.lengthSq() < 0.0001) this.tmpForward.set(0,0,-1);
        this.tmpForward.normalize();
        this.tmpRight.set(-this.tmpForward.z, 0, this.tmpForward.x).normalize();
        rig.position.x += (this.tmpForward.x * forwardAmount + this.tmpRight.x * rightAmount) * this.data.speed * seconds;
        rig.position.z += (this.tmpForward.z * forwardAmount + this.tmpRight.z * rightAmount) * this.data.speed * seconds;
        rig.position.y = 0; // keep the user on the floor plane; Quest floor tracking supplies eye height.

        let turn = this.right.x || 0;
        if (Math.abs(turn) > 0.25) rig.rotation.y -= turn * THREE.MathUtils.degToRad(this.data.turnSpeed) * seconds;
      }
    });

    AFRAME.registerComponent('vr-floor-height', {
      init: function () {
        const scene = this.el.sceneEl;
        const cam = document.querySelector('#camera');
        const rig = document.querySelector('#rig');
        scene.addEventListener('enter-vr', function () {
          if (cam) cam.setAttribute('position', '0 0 0');
          if (rig) rig.object3D.position.y = 0;
        });
        scene.addEventListener('exit-vr', function () {
          if (cam) cam.setAttribute('position', '0 1.6 0');
        });
      }
    });

    AFRAME.registerComponent('visibility-toggles', {
      init: function () {
        window.addEventListener('keydown', function (ev) {
          const k = ev.key.toLowerCase();
          if (k === 'l') {
            document.querySelectorAll('.optional-label').forEach(el => {
              const now = el.getAttribute('visible') === true || el.getAttribute('visible') === 'true';
              el.setAttribute('visible', !now);
            });
          }
          if (k === 'p') {
            const board = document.querySelector('#plan-board-group');
            if (board) {
              const now = board.getAttribute('visible') === true || board.getAttribute('visible') === 'true';
              board.setAttribute('visible', !now);
            }
          }
        });
      }
    });
  </script>
